name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Load-bearing: without registry-url, setup-node writes no .npmrc, so
          # NODE_AUTH_TOKEN below is never used and npm ci runs anonymous. Our
          # private @the-real-insight/* deps then 404 (npm masks private packages
          # as "not found" when unauthorized) and every run dies before testing.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm run build

      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit

    # No `services:` block: the engine needs a **replica set**, and a service container
    # cannot be given the `--replSet` argument (services accept image/env/ports/options,
    # never a command). Started as a step instead.
    env:
      MONGO_URL: mongodb://localhost:27017/?replicaSet=rs0
      MONGO_BPM_DB: in-concert-test

    steps:
      - uses: actions/checkout@v4

      # A standalone mongod fails every test that opens a transaction or a change stream:
      #   MongoServerError: Transaction numbers are only allowed on a replica set member or mongos
      #   MongoServerError: The $changeStream stage is only supported on replica sets
      # That is not a flake — it took out all 20 SDK suites, and every run of this job on main
      # had been red since 2026-05-19 because of it.
      - name: Start MongoDB as a single-node replica set
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for _ in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval 'rs.status().ok' | grep -q 1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.status().ok' | grep -q 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm run build

      - name: SDK tests
        run: npm run test:sdk

      - name: Worklist tests
        run: npm run test:worklist

      - name: Conformance tests
        run: npm run test:conformance

      - name: Callback tests
        run: npm run test:callback
